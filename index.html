<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medence Kezelés & Napló</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
            background-image: url('pool_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #app-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            margin: 0 auto 20px auto;
        }

        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #3182ce;
            padding-bottom: 6px;
        }

        h2 {
            font-size: 0.95rem;
            color: #2b6cb0;
            margin-top: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .params-block, .info-box {
            background: rgba(235, 248, 255, 0.85);
            border-left: 4px solid #3182ce;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .params-block p, .info-box p { margin: 2px 0; }

        .input-group { margin-bottom: 8px; }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .row-inputs .input-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.82rem;
    <div class="row-inputs">
        <div class="input-group">
            <label for="pH-value">Mért pH:</label>
            <input type="number" id="pH-value" step="0.1" placeholder="Pl. 8.2">
        </div>
        <div class="input-group">
            <label for="target-pH">Cél pH:</label>
            <input type="number" id="target-pH" step="0.1" value="7.2">
        </div>
    </div>
    <div class="recommendation" id="pH-recommend"></div>

    <div class="input-group" style="margin-top: 6px;">
        <label for="cl-value">Mért Klór érték (Cél: 0,8 - 1,5 ppm):</label>
        <input type="number" id="cl-value" step="0.1" placeholder="Pl. 0.5">
        <div class="recommendation" id="cl-recommend"></div>
    </div>

    <button class="btn" onclick="saveMeasurements()">💾 Mérés Mentése</button>

    <h2>💥 Klórsokk Adagolás</h2>
    <div class="info-box">
        <p>• <strong>Adag:</strong> 310 g – 450 g gyorsaklór</p>
        <p>• <strong>Kanál mérték:</strong> <strong>5 – 7.5 lapos kanál</strong> (60g/kanál)</p>
        <p>• <strong>Használat:</strong> Este, vödörben oldva!</p>
    </div>
    <button class="btn btn-red" onclick="logAction('Klórsokk (350g / ~6 kanál)')">⚡ Klórsokk Beöntve</button>

    <h2>🌿 Algastop Super</h2>
    <div class="info-box" style="border-left-color: #38a169;">
        <p id="alga-status">Még nem volt Alga Stop kezelés rögzítve.</p>
        <p style="margin-top:4px; color:#4a5568;">• Heti adag: <strong>155 – 310 ml</strong> (Kánikulában 460 ml)</p>
    </div>
    <button class="btn btn-green" onclick="logAction('Algastop (200 ml)')">🧪 Algastop Beöntve (Ma)</button>

    <h2>➕ Egyéb Vegyszer Rögzítése</h2>
    <div class="input-group">
        <select id="custom-chem">
            <option value="Kombi tabletta (1 db)">Kombi tabletta (1 db)</option>
            <option value="pH-mínusz (360g / 6 kanál)">pH-mínusz (360g / 6 kanál)</option>
            <option value="pH-mínusz (1080g / 18 kanál)">pH-mínusz (1080g / 18 kanál)</option>
            <option value="Gyorsaklór pótlás (120g / 2 kanál)">Gyorsaklór pótlás (120g / 2 kanál)</option>
            <option value="Pelyhesítő (Flokkuláló)">Pelyhesítő (Flokkuláló)</option>
            <option value="Szűrőmosás / Backwash">Szűrőmosás / Backwash</option>
        </select>
    </div>
    <button class="btn btn-purple" onclick="logCustom()">✅ Hozzáadás a Naplóhoz</button>

    <p id="save-status"></p>

    <h2>📜 Vegyszer Használati Napló
        <button class="clear-btn" onclick="clearHistory()">Törlés</button>
    </h2>
    <ul id="history-list" class="history-list"></ul>
</div>

<script>
    const poolVolumeM3 = 30.8;

    const phInput = document.getElementById('pH-value');
    const targetPhInput = document.getElementById('target-pH');
    const clInput = document.getElementById('cl-value');
    const phRecommend = document.getElementById('pH-recommend');
    const clRecommend = document.getElementById('cl-recommend');
    const algaStatus = document.getElementById('alga-status');
    const saveStatus = document.getElementById('save-status');
    const historyList = document.getElementById('history-list');

    phInput.addEventListener('input', calculatePhRecommend);
    targetPhInput.addEventListener('input', calculatePhRecommend);
    clInput.addEventListener('input', calculateClRecommend);

    // DINAMIKUS pH SZÁMÍTÁS A MEGADOTT CÉLÉRTÉKRE:
    // Alap: 1.0 pH csökkenés = 18 kanál (1080g), így 0.1 csökkenés = 1.8 kanál (108g)
    function calculatePhRecommend() {
        const ph = parseFloat(phInput.value);
        const targetPh = parseFloat(targetPhInput.value) || 7.2;

        if (isNaN(ph)) { phRecommend.style.display = 'none'; return; }
        phRecommend.style.display = 'block';

        if (ph > targetPh) {
            const diff = ph - targetPh;
            const flatSpoons = Math.round((diff / 0.1) * 1.8);
            const totalGramms = flatSpoons * 60; // 1 lapos kanál = 60g

            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>pH csökkentés szükséges!</strong><br>
            • Cél érték: <strong>${targetPh} pH</strong> (Eltérés: ${diff.toFixed(1)})<br>
            • Szükséges adag: <strong>${flatSpoons} lapos kanál</strong> (~${totalGramms} g pH-mínusz)`;
        } else if (ph < targetPh) {
            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>Alacsony pH!</strong> A mért érték alacsonyabb a kívánt ${targetPh} célmértéknél.`;
        } else {
            phRecommend.className = "recommendation recommend-ok";
            phRecommend.innerHTML = `✅ <strong>A pH érték pontosan eléri a célt (${targetPh})!</strong>`;
        }
    }

    // KLÓR SZÁMÍTÁS:
    function calculateClRecommend() {
        const cl = parseFloat(clInput.value);
        if (isNaN(cl)) { clRecommend.style.display = 'none'; return; }
        clRecommend.style.display = 'block';

        if (cl < 0.8) {
            clRecommend.className = "recommendation recommend-warn";
            clRecommend.innerHTML = `⚠️ <strong>Alacsony klórszint!</strong><br>
            • Gyorsaklór pótlás: <strong>120 g</strong> (kb. <strong>2 teli kanál</strong>)<br>
            • Vagy végezz egy teljes <strong>Klórsokkot</strong>!`;
        } else if (cl > 1.5) {
            clRecommend.className = "recommendation recommend-warn";
            clRecommend.innerHTML = `⚠️ <strong>Klór túl magas (>1.5 ppm)!</strong> Vedd ki a kombi tablettát egy időre.`;
        } else {
            clRecommend.className = "recommendation recommend-ok";
            clRecommend.innerHTML = `✅ <strong>A klórszint ideális (0,8 - 1,5 ppm)!</strong>`;
        }
    }

    function saveMeasurements() {
        localStorage.setItem('lastPH', phInput.value);
        localStorage.setItem('targetPH', targetPhInput.value);
        localStorage.setItem('lastCL', clInput.value);
        
        if (phInput.value || clInput.value) {
            logAction(`Mérés: pH ${phInput.value || '-'} (Cél: ${targetPhInput.value}) | CL ${clInput.value || '-'} ppm`);
        const savedTargetPH = localStorage.getItem('targetPH');
        const savedCL = localStorage.getItem('lastCL');
        
        if (savedPH) phInput.value = savedPH;
        if (savedTargetPH) targetPhInput.value = savedTargetPH;
        if (savedCL) clInput.value = savedCL;

        if (savedPH) calculatePhRecommend();
        if (savedCL) calculateClRecommend();

        const lastAlgaStr = localStorage.getItem('lastAlgaTreatment');
        if (lastAlgaStr) {
            updateAlgaStatus(new Date(lastAlgaStr), new Date());
        }

        renderHistory();
    }

    function showStatus(msg) {
        saveStatus.innerText = msg;
        setTimeout(() => { saveStatus.innerText = ''; }, 3000);
    }

    window.onload = loadSavedData;

    // Service Worker offline mentéshez
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'medence-app-v6';
            const ASSETS = ['./', 'index.html', 'pool_bg.png'];

            self.addEventListener('install', (e) => {
                e.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
                );
            });

            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    caches.match(e.request).then((response) => response || fetch(e.request))
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(workerUrl).catch(() => {});
    }
</script>

</body>
</html>
