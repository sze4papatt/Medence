<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medence Kezelés & Napló</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
            background-image: url('pool_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #app-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            margin: 0 auto 20px auto;
        }

        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #3182ce;
            padding-bottom: 6px;
        }

        h2 {
            font-size: 0.95rem;
            color: #2b6cb0;
            margin-top: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .params-block, .info-box {
            background: rgba(235, 248, 255, 0.85);
            border-left: 4px solid #3182ce;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .params-block p, .info-box p { margin: 2px 0; }

        .input-group { margin-bottom: 8px; }

        .row-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        .row-inputs .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.82rem;
        }

        input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .recommendation {
            font-weight: 600;
            margin-top: 6px;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            display: block; /* Mindig látható doboz szerkezet */
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .recommend-warn { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .recommend-ok { background-color: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .recommend-info { background-color: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; }
    <!-- CÉL ÉS MÉRT pH MEZŐK -->
    <div class="row-inputs">
        <div class="input-group">
            <label for="pH-value">Mért pH:</label>
            <input type="number" id="pH-value" step="0.1" placeholder="Pl. 8.2">
        </div>
        <div class="input-group">
            <label for="target-pH">Kívánt Cél pH:</label>
            <input type="number" id="target-pH" step="0.1" value="7.2">
        </div>
    </div>
    
    <!-- ITT JELENIK MEG A JAVASLAT -->
    <div class="recommendation recommend-info" id="pH-recommend">
        Írd be a mért pH értéket a kiszámításhoz!
    </div>

    <!-- KLÓR MEZŐ -->
    <div class="input-group" style="margin-top: 10px;">
        <label for="cl-value">Mért Klór érték (Cél: 0,8 - 1,5 ppm):</label>
        <input type="number" id="cl-value" step="0.1" placeholder="Pl. 0.5">
        <div class="recommendation recommend-info" id="cl-recommend" style="display:none;"></div>
    // KISZÁMÍTÁSI LOGIKA A SAJÁT TAPASZTALATOD ALAPJÁN (1.0 pH csökkenés = 18 kanál)
    function calculatePhRecommend() {
        const ph = parseFloat(phInput.value);
        const targetPh = parseFloat(targetPhInput.value) || 7.2;

        if (isNaN(ph)) { 
            phRecommend.className = "recommendation recommend-info";
            phRecommend.innerHTML = "Írd be a mért pH értéket a kiszámításhoz!";
            return; 
        }

        if (ph > targetPh) {
            const diff = ph - targetPh;
            const flatSpoons = Math.round((diff / 0.1) * 1.8);
            const totalGramms = flatSpoons * 60; // 1 lapos kanál = 60g

            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>pH CSÖKKENTÉS SZÜKSÉGES!</strong><br>
            • Mért pH: <strong>${ph}</strong> | Kívánt cél: <strong>${targetPh} pH</strong><br>
            • Szükséges adagolás: <strong>${flatSpoons} lapos kanál</strong> (~${totalGramms} g pH-mínusz)`;
        } else if (ph < targetPh) {
            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>Alacsony pH!</strong> A mért érték (${ph}) alacsonyabb a kívánt cél pH-nál (${targetPh}).`;
        } else {
            phRecommend.className = "recommendation recommend-ok";
            phRecommend.innerHTML = `✅ <strong>A pH érték tökéletes, eléri a beállított ${targetPh} célt!</strong>`;
        calculatePhRecommend();
        if (savedCL) calculateClRecommend();

        const lastAlgaStr = localStorage.getItem('lastAlgaTreatment');
        if (lastAlgaStr) {
            updateAlgaStatus(new Date(lastAlgaStr), new Date());
        }

        renderHistory();
    }

    function showStatus(msg) {
        saveStatus.innerText = msg;
        setTimeout(() => { saveStatus.innerText = ''; }, 3000);
    }

    window.onload = loadSavedData;

    // Service Worker offline mentéshez
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'medence-app-v7';
            const ASSETS = ['./', 'index.html', 'pool_bg.png'];

            self.addEventListener('install', (e) => {
                e.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
                );
            });

            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    caches.match(e.request).then((response) => response || fetch(e.request))
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(workerUrl).catch(() => {});
    }
</script>

</body>
</html>
