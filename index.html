<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medence Kezelés & Napló</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
            background-image: url('pool_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #app-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            margin: 0 auto 20px auto;
        }

        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 1.2rem;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 6px;
            display: none;
            font-size: 0.82rem;
            line-height: 1.35;
            max-height: 140px;
        <p><strong>Víztérfogat:</strong> 30.8 m³ (~31 000 liter)</p>
        <p><strong>Alapkezelés:</strong> Klór Kombi tabletta</p>
    </div>

    <h2>📊 Mérés & Kanál-Adagoló</h2>
    <div class="input-group">
        <label for="pH-value">Mért pH érték (Cél: 7,2 - 7,4):</label>
        <input type="number" id="pH-value" step="0.1" placeholder="Pl. 7.8">
        <div class="recommendation" id="pH-recommend"></div>
    </div>

    <div class="input-group">
        <label for="cl-value">Mért Klór érték (Cél: 0,8 - 1,5 ppm):</label>
        <input type="number" id="cl-value" step="0.1" placeholder="Pl. 0.3">
        <div class="recommendation" id="cl-recommend"></div>
    </div>

    <button class="btn" onclick="saveMeasurements()">💾 Mérés Mentése</button>

    <h2>💥 Klórsokk Adagolás</h2>
    <div class="info-box">
        <p>• <strong>Adag:</strong> 310 g – 450 g gyorsaklór</p>
        <p>• <strong>Kanál mérték:</strong> <strong>5 – 7.5 lapos kanál</strong> (60g/kanál)</p>
        <p>• <strong>Használat:</strong> Este, vödörben oldva!</p>
    </div>
    <button class="btn btn-red" onclick="logAction('Klórsokk (350g / ~6 kanál)')">⚡ Klórsokk Beöntve</button>

    <h2>🌿 Algastop Super</h2>
    <div class="info-box" style="border-left-color: #38a169;">
        <p id="alga-status">Még nem volt Alga Stop kezelés rögzítve.</p>
        <p style="margin-top:4px; color:#4a5568;">• Heti adag: <strong>155 – 310 ml</strong> (Kánikulában 460 ml)</p>
    </div>
    <button class="btn btn-green" onclick="logAction('Algastop (200 ml)')">🧪 Algastop Beöntve (Ma)</button>

    <h2>➕ Egyéb Vegyszer Rögzítése</h2>
    <div class="input-group">
        <select id="custom-chem">
            <option value="Kombi tabletta (1 db)">Kombi tabletta (1 db)</option>
            <option value="pH-mínusz (310g / 5 kanál)">pH-mínusz (310g / 5 kanál)</option>
            <option value="pH-mínusz (620g / 10 kanál)">pH-mínusz (620g / 10 kanál)</option>
            <option value="Gyorsaklór pótlás (120g / 2 kanál)">Gyorsaklór pótlás (120g / 2 kanál)</option>
            <option value="Pelyhesítő (Flokkuláló)">Pelyhesítő (Flokkuláló)</option>
            <option value="Szűrőmosás / Backwash">Szűrőmosás / Backwash</option>
        </select>
    </div>
    <button class="btn btn-purple" onclick="logCustom()">✅ Hozzáadás a Naplóhoz</button>

    <p id="save-status"></p>

    <h2>📜 Vegyszer Használati Napló
        <button class="clear-btn" onclick="clearHistory()">Törlés</button>
    </h2>
    <ul id="history-list" class="history-list"></ul>
</div>

<script>
    const poolVolumeM3 = 30.8;
    const spoonGramms = 60; // 1 teli lapos kanál = 60 gramm

    const phInput = document.getElementById('pH-value');
    const clInput = document.getElementById('cl-value');
    const phRecommend = document.getElementById('pH-recommend');
    const clRecommend = document.getElementById('cl-recommend');
    const algaStatus = document.getElementById('alga-status');
    const saveStatus = document.getElementById('save-status');
    const historyList = document.getElementById('history-list');

    phInput.addEventListener('input', calculatePhRecommend);
    clInput.addEventListener('input', calculateClRecommend);

    // KANÁL SZÁMÍTÁS pH-HOZ:
    // 30.8 m³-nél 0.1 pH csökkentéshez ~310 g pH-mínusz kell
    function calculatePhRecommend() {
        const ph = parseFloat(phInput.value);
        if (isNaN(ph)) { phRecommend.style.display = 'none'; return; }
        phRecommend.style.display = 'block';

        if (ph > 7.4) {
            const diff = ph - 7.3; // 7.3 célra számolunk
            const steps = diff / 0.1;
            const totalGramms = Math.round(steps * 310);
            const flatSpoons = (totalGramms / 60).toFixed(1); // lapos kanál (60g)
            const heapedSpoons = (totalGramms / 70).toFixed(1); // púpozott kanál (70g)

            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>pH csökkentés szükséges!</strong><br>
            • Szükséges: <strong>~${totalGramms} g</strong> pH-mínusz<br>
            • Mérőkanállal: <strong>${flatSpoons} lapos kanál</strong> (vagy ${heapedSpoons} púpozott kanál)`;
        } else if (ph < 7.2) {
            phRecommend.className = "recommendation recommend-warn";
            phRecommend.innerHTML = `⚠️ <strong>Alacsony pH!</strong> Add hozzá a szükséges pH-plusz granulátumot.`;
        } else {
            phRecommend.className = "recommendation recommend-ok";
            phRecommend.innerHTML = `✅ <strong>A pH érték tökéletes (7,2 - 7,4)!</strong>`;
        }
    }

    // KANÁL SZÁMÍTÁS KLÓRHOZ:
    function calculateClRecommend() {
        const cl = parseFloat(clInput.value);
        if (isNaN(cl)) { clRecommend.style.display = 'none'; return; }
        clRecommend.style.display = 'block';

        if (cl < 0.8) {
            clRecommend.className = "recommendation recommend-warn";
            clRecommend.innerHTML = `⚠️ <strong>Alacsony klórszint!</strong><br>
            • Gyorsaklór pótlás: <strong>120 g</strong> (kb. <strong>2 teli kanál</strong>)<br>
            • Vagy végezz egy teljes <strong>Klórsokkot</strong>!`;
        } else if (cl > 1.5) {
            clRecommend.className = "recommendation recommend-warn";
            clRecommend.innerHTML = `⚠️ <strong>Klór túl magas (>1.5 ppm)!</strong> Vedd ki a kombi tablettát egy időre.`;

                    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
                );
            });

            self.addEventListener('fetch', (e) => {

</script>

</body>
</html>
